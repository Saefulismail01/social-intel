events {}
http {
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=desk:10m rate=10r/s;
  server {
    listen 3101;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/radar {
      limit_req zone=desk burst=20 nodelay;
      proxy_pass http://127.0.0.1:8100/api/radar;
      proxy_set_header Host $host;
    }
    location /api/source-health {
      limit_req zone=desk burst=20 nodelay;
      proxy_pass http://127.0.0.1:8100/api/source-health;
      proxy_set_header Host $host;
    }
    location /api/universe {
      limit_req zone=desk burst=10 nodelay;
      proxy_pass http://127.0.0.1:8100/api/universe;
      proxy_set_header Host $host;
    }
    location / {
      limit_req zone=desk burst=30 nodelay;
      proxy_pass http://127.0.0.1:3100;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ~ ^/(docs|openapi.json|health|api/ingest|api/universe/sync|api/collector|api/search-coverage|api/recompute|api/fixtures) { return 404; }
  }
}
