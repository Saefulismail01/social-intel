services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: social_intelligence
      POSTGRES_USER: social
      POSTGRES_PASSWORD: social-local
    volumes:
      - social-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social -d social_intelligence"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - social-redis:/data

  api:
    build: ./backend
    environment:
      SI_DATABASE_URL: postgresql+psycopg://social:social-local@postgres:5432/social_intelligence
      SI_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  social-db:
  social-redis:
